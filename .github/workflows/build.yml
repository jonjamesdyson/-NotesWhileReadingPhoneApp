name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Project Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          fi

      - name: Setup Capacitor and Android Platform
        run: |
          # Install matching Capacitor v6 toolchain
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-dev

          # Identify web assets folder
          DIST_DIR="."
          if [ -d "dist" ]; then DIST_DIR="dist"; fi
          if [ -d "build" ]; then DIST_DIR="build"; fi

          # Generate capacitor configuration
          npx cap init "NotesApp" "com.example.notesapp" --web-dir "$DIST_DIR"

          # Add Android platform
          npx cap add android

          # Pre-create required asset files to prevent sync crash
          mkdir -p android/app/src/main/assets
          echo "[]" > android/app/src/main/assets/capacitor.plugins.json

          # Copy web assets and sync plugins
          npx cap copy android
          npx cap sync android

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
