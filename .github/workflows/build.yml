name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web Assets
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          fi

      - name: Prepare Capacitor Framework
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Handle missing build directory automatically
          DIST_DIR="."
          if [ -d "dist" ]; then DIST_DIR="dist"; fi
          if [ -d "build" ]; then DIST_DIR="build"; fi
          
          npx cap init "NotesApp" "com.example.notesapp" --web-dir "$DIST_DIR"
          npx cap add android
          npx cap sync android

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
